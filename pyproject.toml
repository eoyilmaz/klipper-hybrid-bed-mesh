[project]
authors = [
    {name = "Erkan Özgür Yılmaz", email = "eoyilmaz@gmail.com"},
]
classifiers = [
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Printing",
]
description = "A Klipper extra that builds a bed mesh from an Eddy rapid scan and nozzle taps on the front strip the coil can't reach."
license = "MIT"
name = "klipper-hybrid-bed-mesh"
readme = "README.md"
requires-python = ">= 3.9"
version = "0.1.0"

[project.urls]
Repository = "https://github.com/eoyilmaz/klipper-hybrid-bed-mesh"

[tool.ruff.lint]
select = [
    "A",  # flake8-builtins
    "ANN",  # flake-annotations
    "B",  # flake8-bugbear
    "C",  # McCabe complexity
    "C4",  # flake8-comprehensions
    "COM",  # flake8-commas
    "D",  # pydocstyle
    "E",  # pycodestyle
    "F",  # Pyflakes
    "FA",  # flake8-future-annotations
    "I",  # isort
    "LOG",  # flake8-logging
    "N",  # PEP8 Naming
    "PERF",  # perflint
    "PIE",  # flake8-pie
    "PLR",  # Pylint - Refactor
    "RET",  # flake8-return
    "RUF",  # Ruff-specific-rules
    "S",  # flake-bandit
    "SIM",  # flake8-simplify
    "TC",  # flake8-type-checking
    "UP",  # pyupgrade
]
extend-ignore = [
    "COM812",  # flake8-commas
    "D104",  # Missing docstring in public package
    "D107",  # skip docstring for __init__
    "D203",  # Incorrect blank line before class
    "D213",  # Multiline docstring summary second line
    "PLR0913",  # Too many arguments
    "PLR2004",  # Magic value comparison
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ALL"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.pytest.ini_options]
pythonpath = [
    ".",
]

# The hybrid bed mesh related part of a working printer.cfg (a corexy with a
# BTT Eddy mounted 33.808mm behind the nozzle, 235x235 bed, 3 Z motors).
#
# Copy the sections you need into your own printer.cfg and change the
# positions to match your printer. The calibration results (eddy, tap
# threshold, drift and axis twist) are machine specific and stored by
# SAVE_CONFIG, they are not part of this file.

[probe_eddy_current btt_eddy_probe]
sensor_type: ldc1612
descend_z: 0.5
i2c_mcu: eddy
i2c_bus: i2c0f
x_offset: 0
y_offset: 33.808  # the coil is behind the nozzle, the front 33.8mm of the bed is out of its reach
tap_z_offset: 0
speed: 3  # METHOD=tap ignores this and defaults to 5mm/s, tap commands need PROBE_SPEED=3

[temperature_probe btt_eddy_probe]
sensor_type: Generic 3950
sensor_pin: eddy:gpio26
calibration_position: 117.5, 95.2, 5  # Z above the bed: ACCEPT needs a lower Z than the start, and a tap needs room to descend
resting_z: 4  # the next tap starts from this height, the 0.4 default left the tap no room to descend
calibration_extruder_temp: 130
calibration_bed_temp: 65
max_validation_temp: 65

[bed_mesh]
speed: 200
horizontal_move_z: 2
mesh_min: 10, 34.00  # the front edge the eddy coil can reach
mesh_max: 220, 225
probe_count: 21, 21
algorithm: bicubic
fade_start: 1
fade_end: 10
fade_target: 0
adaptive_margin: 5
scan_overshoot: 10
zero_reference_position: 117.5, 117.5  # same nozzle XY as TAP_Z_CALIBRATE, keeps the mesh from undoing the tap Z correction

; BED_MESH_HYBRID_CALIBRATE: the eddy coil sits 33.808mm behind the nozzle and
; can't reach the front strip of the bed, so the rows in front of scan_min_y
; are tapped with the nozzle and merged into the rapid scanned mesh. Takes the
; same MESH_MIN / MESH_MAX / PROBE_COUNT / ALGORITHM / PROFILE parameters as
; BED_MESH_CALIBRATE, plus TAP_SAMPLES / TAP_SAMPLE_RETRACT_DIST /
; TAP_PROBE_SPEED / TAP_SETTLE_TIME / TAP_HORIZONTAL_MOVE_Z. The nozzle must be
; clean and below oozing temperature.
[hybrid_bed_mesh]
mesh_min: 10, 5          # the front row is tapped, the nozzle can go down to Y0
mesh_max: 220, 225
probe_count: 21, 21      # 11mm rows: Y5, Y16 and Y27 are tapped, Y38 is the overlap row
scan_min_y: 34.00        # the smallest Y the eddy coil scans, same as [bed_mesh] mesh_min
tap_x_count: 7           # taps per front row, interpolated onto the 21 mesh columns
tap_samples: 3
tap_sample_retract_dist: 4
tap_probe_speed: 3       # 5mm/s (the METHOD=tap default) gave bimodal taps
tap_settle_time: 0.5     # pause after each move, a tap started while the toolhead still rings triggers in mid-air
horizontal_move_z: 5     # tap start height, this eddy sensor needs ~4mm to reliably detect a tap
speed: 150               # travel speed between the taps
overlap_alignment: linear # line up the taps with the scan by offset + X slope, axis twist compensation leaves an X slope between nozzle and coil at the front
max_overlap_offset: 0.5  # abort if tap and scan disagree by more than this on the overlap row
max_overlap_deviation: 0.1 # warn if they still differ by more than this after lining them up

[axis_twist_compensation]
calibrate_start_x: 10
calibrate_end_x: 220
calibrate_y: 117.5
calibrate_start_y: 35  # >= probe y_offset, the toolhead can't go below Y0 to put the coil over the point
calibrate_end_y: 190  # the tap needs the coil over the bed too, it sits y_offset behind the nozzle: 190 + 33.8 = 223.8
calibrate_x: 117.5

[gcode_macro TAP_Z_CALIBRATE]
gcode:
    PROBE METHOD=tap SAMPLES=3 SAMPLE_RETRACT_DIST=4 PROBE_SPEED=3 ; average 3 taps; this eddy sensor needs the full 4mm lift-off to reliably detect each tap
    M400
    _APPLY_TAP_Z_CORRECTION

; Kept separate from TAP_Z_CALIBRATE: a gcode_macro's entire template is
; rendered up front, before any of its own lines (like PROBE) have run, so
; reading printer.probe.last_probe_position in the same macro as the PROBE
; call would see stale/default state instead of this tap's result.
[gcode_macro _APPLY_TAP_Z_CORRECTION]
variable_max_correction: 1.0 ; abort instead of applying a correction larger than this many mm
gcode:
    {% set drift = printer.probe.last_probe_position.z %}
    {% if drift | abs > max_correction %}
        { action_raise_error("TAP_Z_CALIBRATE: measured Z drift of %.3fmm exceeds the %.3fmm safety limit - aborting instead of risking a crash. Check tap_threshold/tap_z_offset calibration and Z homing." % (drift, max_correction)) }
    {% else %}
        RESPOND MSG={"'TAP_Z_CALIBRATE: applying Z correction of %.3fmm' " % (drift,)}
        {% set z_now = printer.toolhead.position.z %}
        SET_KINEMATIC_POSITION Z={z_now - drift}
    {% endif %}
